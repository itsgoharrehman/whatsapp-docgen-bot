name: Bug Report
description: Report an issue, rendering glitch, or unexpected behavior in whatsapp-docgen-bot
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue.
        If this is a security vulnerability, please do NOT use this form; refer to [SECURITY.md](https://github.com/itsgoharrehman/whatsapp-docgen-bot/blob/main/SECURITY.md) instead.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: format
    attributes:
      label: Document Format
      description: Does this affect PDF generation, PPTX generation, or the Web UI?
      placeholder: "PDF / PPTX / Web UI / Bot Socket"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact prompt or API call used.
      placeholder: |
        1. Send command `/pptx Marketing Plan`
        2. Wait for rendering
        3. Observe error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal Logs
      description: Paste relevant terminal logs (ensure credentials are sanitized).