name: Feature Request
description: Propose a new document format, skill module, or feature
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Propose a new document format, layout style, or operational enhancement.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is this feature related to a limitation or layout requirement?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Clear description of the proposed feature and implementation approach.
    validations:
      required: true